services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: zero_trust_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - internal

  ollama:
    build:
      context: ..
      dockerfile: docker/Dockerfile.llm
    container_name: zero_trust_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag_api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: zero_trust_fastapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
      OLLAMA_MODEL: llama3
      LLM_MODEL_NAME: llama3
    depends_on:
      - qdrant
      - ollama
    networks:
      - internal

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: streamlit_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://rag_api:8000
    depends_on:
      - rag_api
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
  ollama_storage:
    driver: local
