networks:
  airgap_network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
  ollama_storage:
    driver: local

services:
  # 1. Vector Database
  qdrant:
    image: qdrant/qdrant:v1.9.2  #v1.12.0
    container_name: zero_trust_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - airgap_network

  # 2. Air-Gapped Local LLM Runtime
  ollama:
    build:
      context: ..
      dockerfile: docker/Dockerfile.llm
    container_name: zero_trust_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - airgap_network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Core Engine
  rag_api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: zero_trust_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://ollama:11434
      - EMBEDDING_MODEL_NAME=BAAI/bge-small-en-v1.5
      - LLM_MODEL_NAME=llama3
      - JWT_SECRET_KEY=super-secret-zero-trust-key-change-in-prod
    depends_on:
      - qdrant
      - ollama
    networks:
      - airgap_network