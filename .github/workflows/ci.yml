name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  retrieval-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile application modules
        run: python -m compileall -q src ui
      - name: Run deterministic retrieval tests
        run: python -m pytest -q tests/test_hybrid_retrieval_unit.py
